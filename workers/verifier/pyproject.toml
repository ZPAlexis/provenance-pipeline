[project]
name = "verifier"
version = "0.1.0"
description = "Verification worker for Provenance Pipeline: renders careers pages and extracts job listings."
readme = "README.md"
authors = [
    { name = "ZPAlexis", email = "avfcoelho@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.9,<2",
    "playwright>=1.63,<2",
    "pydantic>=2,<3",
]

[project.scripts]
verifier = "verifier.cli:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The system prompt is prose sent to the model; wrapping it would change the prompt.
"src/verifier/extract.py" = ["E501"]
